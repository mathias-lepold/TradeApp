[alembic]
script_location = alembic
prepend_sys_path = .

# Sync URL für Migrationen (asyncpg nicht kompatibel mit Alembic direkt)
# Wird in env.py durch DATABASE_URL aus .env überschrieben
sqlalchemy.url = postgresql+psycopg2://trader:tradepass@localhost:5432/tradeapp

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
